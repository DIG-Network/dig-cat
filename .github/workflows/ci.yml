name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format / Clippy / Build / Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # Lint/build/doc with ALL features so the optional `dexie` network path can never rot
      # (a feature that doesn't compile or lint is a latent bug). Coverage stays default-features
      # (network-free) in the job below.
      - name: Check clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (release, all features)
        run: cargo build --release --all-features

      - name: Check documentation (all features)
        run: cargo doc --no-deps --all-features

  coverage:
    name: Coverage (>=80% lines)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Unit + integration coverage, CI-gated at >=80% lines (ecosystem standard). Run through
      # nextest so llvm-cov instruments the SAME execution (a separate `cargo test` collects zero
      # coverage). `--retries 2` reports a flaky test rather than hard-failing while keeping coverage
      # intact. The whole crate is exercised and counted; nothing is ignored.
      - name: Run tests with coverage (nextest, retries 2, gate >=80% lines)
        run: >-
          cargo llvm-cov nextest --all
          --retries 2
          --fail-under-lines 80
          --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: error
