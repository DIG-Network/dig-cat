# dig-cat — the DIG Network canonical Chia CAT (Colored Coin) expert crate.
#
# A pure, key-free, network-free SpendBundle-builder library for Chia Asset Tokens (CATs, CHIP-0002).
# dig-cat constructs the exact CoinSpends for every CAT operation — issuance, send, melt, combine,
# split — and reports the exact signatures a caller must produce. It NEVER holds a secret key, NEVER
# signs, and NEVER touches the network. The consumer signs the reported messages, assembles the
# SpendBundle, and broadcasts. See SPEC.md for the normative contract.
#
# This is the v0.0.0 bootstrap: it establishes the crate, the release/quality pipeline, and proves
# the pinned chia-wallet-sdk 0.30 dependency tree resolves + compiles. The complete CAT builder
# surface (issuance / send / melt / lineage / multi-TAIL) lands as v0.1.0 in a single triple-gated
# feature PR against this foundation.
[package]
name = "dig-cat"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0 OR MIT"
description = "The DIG Network canonical Chia CAT (Colored Coin, CHIP-0002) expert crate: a pure, key-free, network-free SpendBundle-builder for CAT issuance, send, melt, combine/split, and lineage-proof reconstruction. Never holds a key, never signs, never broadcasts — the consumer signs + pushes."
repository = "https://github.com/DIG-Network/dig-cat"
readme = "README.md"
keywords = ["dig", "chia", "cat", "token", "colored-coin"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[lib]
# rlib for native consumers; cdylib so a later unit can compile a wasm façade over the same crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The chia-wallet-sdk umbrella is the byte-source-of-truth for every CAT puzzle, layer, and spend
# (INV-4). Pinned to the 0.30 family the whole DIG on-chain line rides (chia-protocol 0.26). We
# consume the CAT primitive, the standard p2 layer, the spend context, and the pure signing
# calculator through it so the chia-* tree resolves to ONE coherent version set.
chia-wallet-sdk = "0.30"
# Direct type deps, pinned to EXACTLY the versions chia-wallet-sdk 0.30 resolves to (a mismatch is a
# hard cargo error). chia-protocol carries wire types (`Coin`, `CoinSpend`, `Bytes32`);
# chia-puzzle-types carries `LineageProof`/`CoinProof`; clvm-traits carries the CLVM (de)serialization
# traits used to parse/curry CAT puzzles.
chia-protocol = "0.26"
chia-puzzle-types = "0.26"
clvm-traits = "0.26"
# The crate error taxonomy (SPEC §6). thiserror 2 matches the sibling DIG crates.
thiserror = "2"

[dev-dependencies]
# The in-process Chia Simulator + BLS keypair helpers for building real coin spends in tests.
chia-sdk-test = "0.30"
# Hex assertions on computed asset ids / signature messages / coin ids in tests.
hex = "0.4"
